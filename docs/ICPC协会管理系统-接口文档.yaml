          schema: { type: integer }
      responses:
        '200':
          description: 历史测评结果（取最新一次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MbtiResult'

