    post:
      summary: 审核赛事报名
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
        - name: applyId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                remark: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /contests/{contestId}/leaderboard:
    get:
      summary: 获取赛事实时榜单
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 榜单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          frozen: { type: boolean }
                          entries:
                            type: array
                            items:
                              $ref: '#/components/schemas/LeaderboardEntry'

  /contests/{contestId}/submit:
    post:
      summary: 比赛中提交代码
