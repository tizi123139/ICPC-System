                    type: object
                    properties:
                      teamId: { type: integer }
                      rank: { type: integer }
                      award: { type: string, description: "如 '金奖'、'银奖'、'铜奖'、'优秀'" }
                      score: { type: number }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  # ==================== MBTI 管理（低优先级） ====================
  /mbti/questions:
