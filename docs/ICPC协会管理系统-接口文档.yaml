    post:
      summary: 批量生成获奖电子证书
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId: { type: integer }
                awardRules:
                  type: array
                  items:
                    type: object
                    properties:
                      awardName: { type: string }
                      rankRange: { type: string, description: "如 '1-3'" }
      responses:
        '200':
          description: 证书生成结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
