      summary: 创建/发布赛事
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, startTime, endTime, registrationDeadline]
              properties:
                name: { type: string }
                category:
                  type: string
                  enum: [SCHOLASTIC, XCPC, NON_XCPC]
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                registrationDeadline: { type: string, format: date-time }
                description: { type: string }
                requirements: { type: string }
                maxTeamSize: { type: integer, default: 3 }
                problemIds:
                  type: array
                  items: { type: integer }
                freezeMinutes: { type: integer, default: 60, description: "封榜时间（结束前 N 分钟）" }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /contests/{contestId}:
    get:
      summary: 获取赛事详情
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContestInfo'

  /contests/{contestId}/registrations:
    get:
      summary: 查询赛事报名列表
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: 报名列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApplyRecord'

  /contests/{contestId}/register:
    post:
      summary: 队伍/个人报名赛事
      tags: [contests, 赛事管理]
      security: [bearerAuth: []]
      parameters:
        - name: contestId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId: { type: integer, description: "组队赛传 teamId，个人赛不传" }
                materials:
                  type: array
                  description: "报名材料 URL 列表（非 XCPC 赛事可选）"
                  items: { type: string }
                remark: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

