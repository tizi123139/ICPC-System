        '200':
          description: MBTI 题目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId: { type: integer }
                            content: { type: string }
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  option: { type: string }
                                  dimension: { type: string, description: "E/I/S/N/T/F/J/P" }
                                  value: { type: integer }

