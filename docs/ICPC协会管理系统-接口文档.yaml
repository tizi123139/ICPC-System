openapi: "3.0.3"
info:
  title: ICPC 协会管理系统 API
  version: "1.0.0"
  description: |
    中南民族大学 ICPC 协会管理系统后端接口规范。

    **技术栈**：Spring Boot 3.2+ / MySQL 8.0 / Redis 7.x
    **鉴权方式**：JWT Bearer Token（登录后返回，后续请求放入 `Authorization` 头）
    **基础路径**：`/api/v1`

    ## 角色速查表
    | 编号 | 角色编码 | 角色名称 |
    |------|---------|---------|
    | R01 | OBSERVE_MEMBER | 观察会员 |
    | R02 | MEMBER | 正式会员 |
    | R03 | LAB_MEMBER | 竞赛实验室成员 |
    | R04 | TEAM_LEADER | 队长 |
    | R05 | OFFICER | 干事 |
    | R06 | ASSISTANT_COACH | 助理教练 |
    | R07 | MINISTER | 部长/副部长 |
    | R08 | PRESIDENT | 会长/副会长 |
    | R09 | ADVISOR | 指导老师 |

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://icpc.scuec.edu.cn/api/v1
    description: 生产环境（示例）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Success:
      description: 通用成功响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 0
            message: "ok"
            data: {}
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 400
            message: "参数校验失败：xxx 字段不能为空"
            data: null
    Unauthorized:
      description: 未登录 / Token 过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 401
            message: "未授权，请先登录"
            data: null
    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 403
            message: "无权执行此操作"
            data: null
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 404
            message: "资源不存在"
            data: null

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 状态码，0 表示成功，非 0 表示失败
        message:
          type: string
          description: 提示信息
        data:
          nullable: true
          description: 业务数据（成功时返回）

    PageResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
              description: 总记录数
            page:
              type: integer
              description: 当前页码（从 1 开始）
            size:
              type: integer
              description: 每页条数
            records:
              type: array
              description: 当前页数据列表

    LoginRequest:
      type: object
      required: [studentId, password]
      properties:
        studentId:
          type: string
          description: 学号
          example: "2023210100"
        password:
          type: string
          description: 密码
          example: "******"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Token
        expiresIn:
          type: integer
          description: 过期时间（秒）
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        userId:
          type: integer
        studentId:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
            description: 角色编码
        avatar:
          type: string
          nullable: true

    MemberInfo:
      type: object
      properties:
        memberId:
          type: integer
        name:
          type: string
        studentId:
          type: string
        major:
          type: string
        grade:
          type: string
          description: 年级，如 "2023级"
        phone:
          type: string
        email:
          type: string
        memberType:
          type: string
          enum: [OBSERVE_MEMBER, MEMBER, LAB_MEMBER]
        department:
          type: string
          nullable: true
        joinDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, INACTIVE, RESIGNED, REMOVED]
        createTime:
          type: string
          format: date-time

    ProblemInfo:
      type: object
      properties:
        problemId:
          type: integer
        title:
          type: string
        ojProblemId:
          type: string
          description: 对应自建 OJ 的题目编号
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        timeLimit:
          type: integer
          description: 时间限制（毫秒）
        memoryLimit:
          type: integer
          description: 内存限制（KB）
        description:
          type: string
          description: 题目描述（Markdown）
        inputFormat:
          type: string
        outputFormat:
          type: string
        sampleInput:
          type: string
        sampleOutput:
          type: string
        hint:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        solution:
          $ref: '#/components/schemas/Solution'
        visibility:
          type: string
          enum: [PUBLIC, TRAINING_PRIVATE]

    Tag:
      type: object
      properties:
        tagId:
          type: integer
        name:
          type: string
        category:
          type: string
          description: 知识点分类，如 "DP"、"图论"、"数论"

    Solution:
      type: object
      properties:
        solutionId:
          type: integer
        content:
          type: string
          description: 题解内容（Markdown）
        referenceCode:
          type: string
          nullable: true
        updateTime:
          type: string
          format: date-time

    TrainingInfo:
      type: object
      properties:
        trainingId:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [SOLO, TEAM]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        leaderboardVisible:
          type: boolean
        freezeTime:
          type: integer
          description: 封榜开始时间（训练结束前 N 分钟），0 表示不封榜
        problemIds:
          type: array
          items:
            type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ONGOING, ENDED]
        creator:
          $ref: '#/components/schemas/UserInfo'
        createTime:
          type: string
          format: date-time

    SubmitRecord:
      type: object
      properties:
        submitId:
          type: integer
        trainingId:
          type: integer
        problemId:
          type: integer
        submitter:
          $ref: '#/components/schemas/UserInfo'
        code:
          type: string
          description: 提交的源代码（列表接口不返回）
        language:
          type: string
          description: 编程语言，如 "C++17"、"Java 17"
        result:
          type: string
          enum: [PENDING, JUDGING, AC, WA, TLE, MLE, RE, CE]
        timeUsed:
          type: integer
          description: 耗时（毫秒）
        memoryUsed:
          type: integer
          description: 内存（KB）
        submitTime:
          type: string
          format: date-time

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        teamId:
          type: integer
          nullable: true
        teamName:
          type: string
          nullable: true
        solvedCount:
          type: integer
        penalty:
          type: integer
          description: 罚时（分钟）

    TeamInfo:
      type: object
      properties:
        teamId:
          type: integer
        name:
          type: string
        leaderId:
          type: integer
        memberIds:
          type: array
          items:
            type: integer
        contestTarget:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, DISSOLVED]
        createTime:
          type: string
          format: date-time

    ContestInfo:
      type: object
      properties:
        contestId:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [SCHOLASTIC, XCPC, NON_XCPC]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        description:
          type: string
        registrationDeadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [ANNOUNCED, REGISTERING, ONGOING, ENDED]

    CheckInRecord:
      type: object
      properties:
        recordId:
          type: integer
        campId:
          type: integer
          description: 集训 ID（寒假/暑假集训共用签到模块）
        userId:
          type: integer
        checkInDate:
          type: string
          format: date
        checkInTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PRESENT, ABSENT, LEAVE, MAKEUP]

    ApplyRecord:
      type: object
      properties:
        applyId:
          type: integer
        type:
          type: string
          description: 申请类型，如 JOIN_MEMBER、RESIGN、CAMP_REGISTER、CONTEST_REGISTER
        applicantId:
          type: integer
        applyData:
          type: object
          description: 申请详情（JSON，不同类型结构不同）
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        auditRemark:
          type: string
          nullable: true
        auditorId:
          type: integer
          nullable: true
        applyTime:
          type: string
          format: date-time
        auditTime:
          type: string
          format: date-time
          nullable: true

    MbtiResult:
      type: object
      properties:
        resultId:
          type: integer
        userId:
          type: integer
        type:
          type: string
          description: MBTI 类型，如 "INTJ"、"ENFP"
        scores:
          type: object
          description: 各维度得分
          properties:
            E_I: { type: number }
            S_N: { type: number }
            T_F: { type: number }
            J_P: { type: number }
        reportUrl:
          type: string
          nullable: true
        testTime:
          type: string
          format: date-time

paths:
  # ==================== 认证模块 ====================
  /auth/login:
    post:
      summary: 用户登录
      tags: [auth, 认证模块]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 账号或密码错误

  /auth/logout:
    post:
      summary: 用户登出
      tags: [auth, 认证模块]
      security: [bearerAuth: []]
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /auth/profile:
    get:
      summary: 获取当前登录用户信息
      tags: [auth, 认证模块]
      security: [bearerAuth: []]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'

  # ==================== 会员管理 ====================
  /members:
    get:
      summary: 分页查询会员列表
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: keyword
          in: query
          description: 姓名/学号模糊搜索
          schema: { type: string }
        - name: memberType
          in: query
          schema:
            type: string
            enum: [OBSERVE_MEMBER, MEMBER, LAB_MEMBER]
        - name: grade
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, RESIGNED, REMOVED]
      responses:
        '200':
          description: 分页会员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/MemberInfo'

    post:
      summary: 新增会员（管理员）
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, name, major, memberType]
              properties:
                studentId: { type: string }
                name: { type: string }
                major: { type: string }
                grade: { type: string }
                phone: { type: string }
                email: { type: string }
                memberType:
                  type: string
                  enum: [OBSERVE_MEMBER, MEMBER, LAB_MEMBER]
                department: { type: string }
                joinDate: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /members/{memberId}:
    get:
      summary: 获取会员详情
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 会员详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemberInfo'

    put:
      summary: 更新会员信息
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                major: { type: string }
                grade: { type: string }
                phone: { type: string }
                email: { type: string }
                memberType:
                  type: string
                  enum: [OBSERVE_MEMBER, MEMBER, LAB_MEMBER]
                department: { type: string }
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, RESIGNED, REMOVED]
      responses:
        '200':
          $ref: '#/components/responses/Success'

    delete:
      summary: 删除会员（逻辑删除）
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /members/{memberId}/archive:
    get:
      summary: 获取会员完整档案（含训练记录、竞赛成绩、奖惩）
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 会员完整档案
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          basicInfo:
                            $ref: '#/components/schemas/MemberInfo'
                          trainingRecords:
                            type: array
                            items: { type: object }
                          contestRecords:
                            type: array
                            items: { type: object }
                          rewards:
                            type: array
                            items: { type: object }
                          punishments:
                            type: array
                            items: { type: object }

  /members/apply/join:
    post:
      summary: 提交入会申请
      tags: [members, 会员管理]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, name, major, grade, reason]
              properties:
                studentId: { type: string }
                name: { type: string }
                major: { type: string }
                grade: { type: string }
                phone: { type: string }
                reason: { type: string, description: 入会动机 }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /members/apply/resign:
    post:
      summary: 提交退会申请
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /members/approvals:
    get:
      summary: 查询待审批申请列表（入会/退会）
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [JOIN_MEMBER, RESIGN, REMOVE]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApplyRecord'

  /members/approvals/{applyId}/audit:
    post:
      summary: 审批申请（通过或驳回）
      tags: [members, 会员管理]
      security: [bearerAuth: []]
      parameters:
        - name: applyId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                remark: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  # ==================== 知识点管理 ====================
  /tags:
    get:
      summary: 获取知识点树
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      responses:
        '200':
          description: 知识点层级列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            tagId: { type: integer }
                            name: { type: string }
                            category: { type: string }
                            children:
                              type: array
                              items: { type: object }

    post:
      summary: 新增知识点
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                category: { type: string }
                parentId: { type: integer, nullable: true }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /tags/{tagId}:
    put:
      summary: 修改知识点
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                category: { type: string }
                parentId: { type: integer, nullable: true }
      responses:
        '200':
          $ref: '#/components/responses/Success'

    delete:
      summary: 删除知识点
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  # ==================== 题目管理 ====================
  /problems:
    get:
      summary: 分页查询题目列表
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: keyword
          in: query
          description: 题目标题搜索
          schema: { type: string }
        - name: tagId
          in: query
          description: 按知识点筛选
          schema: { type: integer }
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [EASY, MEDIUM, HARD]
        - name: visibility
          in: query
          schema:
            type: string
            enum: [PUBLIC, TRAINING_PRIVATE]
      responses:
        '200':
          description: 题目分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ProblemInfo'

    post:
      summary: 新增题目
      tags: [problems, 题库管理]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, difficulty, timeLimit, memoryLimit, description, inputFormat, outputFormat, sampleInput, sampleOutput]
              properties:
                title: { type: string }
                ojProblemId: { type: string }
                difficulty:
                  type: string
                  enum: [EASY, MEDIUM, HARD]
                timeLimit: { type: integer }
                memoryLimit: { type: integer }
                description: { type: string, description: "Markdown 格式" }
                inputFormat: { type: string }
                outputFormat: { type: string }
                sampleInput: { type: string }
                sampleOutput: { type: string }
                hint: { type: string }
                tagIds:
                  type: array
                  items: { type: integer }
                visibility:
                  type: string
