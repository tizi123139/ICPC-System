spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 使用本机 3306 实例，tizi1234 已由 root 授权 icpc_system 库
    url: ${DB_URL:jdbc:mysql://localhost:3306/icpc_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:tizi1234}
    password: ${DB_PASSWORD:Tizi6666}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  # 启动时自动建表并导入演示数据；脚本均使用 IF NOT EXISTS / INSERT IGNORE，可重复执行
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

logging:
  level:
    com.scuec.icpc: debug
